<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 600px;
      width: 90%; /* Ensures it looks good on mobile */
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); /* Adds depth */
      transform: translateY(0);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      color: #ff4f81;
      font-size: 2.2em;
      margin-bottom: 25px;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 30px;
      background: #ff4f81;
      color: white;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(255, 79, 129, 0.4);
    }

    button:hover {
      background: #e63e6d;
      transform: scale(1.05); /* Slight pop effect */
      box-shadow: 0 8px 20px rgba(255, 79, 129, 0.6);
    }

    button:active {
      transform: scale(0.95); /* Click down effect */
    }

    #msg-container {
      margin-top: 30px;
      font-size: 1.25em;
      color: #444;
      line-height: 1.6;
      display: none;
      min-height: 150px; /* Prevents card from jumping too much */
    }

    /* Blinking cursor effect */
    .cursor {
      display: inline-block;
      width: 3px;
      height: 1.1em;
      background-color: #ff4f81;
      animation: blink 0.8s infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>

<body>

<div class="card">
  <h1>🎂 Happy Birthday, My Love ❤️</h1>

  <button id="surpriseBtn" onclick="show()">Open Surprise 💌</button>

  <div id="msg-container">
    <span id="msg"></span><span class="cursor" id="cursor"></span>
  </div>
</div>

<script>
const text = `Happy Birthday, baby ❤️\n\nThank you for being my happiness,\nmy safe place, and my love.\n\nI am so grateful for you.\n\nI love you so much ❤️`;

function show() {
  const btn = document.getElementById("surpriseBtn");
  const msgContainer = document.getElementById("msg-container");
  const msg = document.getElementById("msg");
  const cursor = document.getElementById("cursor");

  // Hide the button so the user can't click it multiple times and break the typing loop
  btn.style.display = "none";
  msgContainer.style.display = "block";

  let i = 0;
  msg.innerHTML = "";

  function type() {
    if (i < text.length) {
      // Convert standard newlines to HTML line breaks
      msg.innerHTML += text[i] === "\n" ? "<br>" : text[i];
      i++;
      
      // Randomize typing speed slightly for a more natural "human" feel (between 30ms and 80ms)
      const typingSpeed = Math.floor(Math.random() * 50) + 30;
      setTimeout(type, typingSpeed);
    } else {
      // Optional: Stop the cursor blinking once finished
      cursor.style.animation = "none";
      cursor.style.opacity = "0";
    }
  }

  type();
}
</script>

</body>
</html>
